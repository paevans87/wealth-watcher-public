services:
  wealth-watcher-webhook-relay:
    image: ${RELAY_IMAGE:-wealth-watcher-webhook-relay}
    build:
      context: ./WealthWatcher.WebhookRelay
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__RelayDatabase: Data Source=/data/relay.db
      Relay__Installations__0__Id: ${RELAY_INSTALLATION_ID:?Set RELAY_INSTALLATION_ID in .env before starting the relay}
      Relay__Installations__0__Token: ${RELAY_TOKEN:?Set RELAY_TOKEN in .env before starting the relay}
      Relay__Providers__SnapTrade__ConsumerKey: ${SNAPTRADE_CONSUMER_KEY:?Set SNAPTRADE_CONSUMER_KEY in .env before starting the relay}
    volumes:
      - ${RELAY_DATA_PATH:-./relay-data}:/data
    ports:
      - "${RELAY_BIND_ADDRESS:-127.0.0.1}:${RELAY_PORT:-8080}:8080"
    restart: unless-stopped
