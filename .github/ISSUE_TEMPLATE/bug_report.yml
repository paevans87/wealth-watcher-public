name: Bug report
description: Report a reproducible problem with Wealth Watcher
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, account identifiers, private URLs, or real financial data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behaviour and the expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest safe reproduction.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
