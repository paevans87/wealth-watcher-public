name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Restore API dependencies
        run: dotnet restore WealthWatcher.Api.Tests/WealthWatcher.Api.Tests.csproj
      - name: Build API
        run: dotnet build WealthWatcher.Api.Tests/WealthWatcher.Api.Tests.csproj --configuration Release --no-restore
      - name: Test API
        run: dotnet test WealthWatcher.Api.Tests/WealthWatcher.Api.Tests.csproj --configuration Release --no-build --no-restore

  ui:
    name: UI tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: WealthWatcher.UI/package-lock.json
      - name: Install UI dependencies
        run: npm ci --prefix WealthWatcher.UI
      - name: Test UI
        run: npm test --prefix WealthWatcher.UI
      - name: Build UI
        run: npm run build --prefix WealthWatcher.UI

  containers:
    name: Container validation
    needs: [api, ui]
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose configuration
        run: docker compose config
      - name: Check API Dockerfile
        run: docker build --check WealthWatcher.Api
      - name: Check UI Dockerfile
        run: docker build --check WealthWatcher.UI

  sbom:
    name: Dependency inventory
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: WealthWatcher.UI/package-lock.json
      - name: Restore dependencies
        run: |
          dotnet restore WealthWatcher.Api/WealthWatcher.Api.csproj
          npm ci --prefix WealthWatcher.UI
      - name: Generate dependency inventories
        run: |
          mkdir -p artifacts
          dotnet list WealthWatcher.Api/WealthWatcher.Api.csproj package --include-transitive --format json > artifacts/api-dependencies.json
          npm sbom --prefix WealthWatcher.UI --sbom-format cyclonedx --sbom-type application > artifacts/ui-sbom.json
      - name: Upload dependency inventories
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-inventories
          path: artifacts/

  publish-images:
    name: Publish ${{ matrix.name }} image
    if: >-
      github.repository == 'paevans87/wealth-watcher-public' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [api, ui, containers, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            context: ./WealthWatcher.Api
            image: ghcr.io/paevans87/wealth-watcher-public-api
          - name: UI
            context: ./WealthWatcher.UI
            image: ghcr.io/paevans87/wealth-watcher-public-web
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/paevans87/wealth-watcher-public

      - name: Build and push image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
