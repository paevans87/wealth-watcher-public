name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    # Dependency review is available for public repositories or private
    # repositories with GitHub Code Security/Advanced Security enabled.
    if: github.event.repository.visibility == 'public' || vars.ENABLE_GITHUB_SECURITY_SCANS == 'true'
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
