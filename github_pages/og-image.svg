<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Wealth Watcher - see your whole financial picture</title>
  <desc id="desc">An open-source, local-first personal-finance dashboard for tracking wealth, budgets, forecasts, and financial independence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#12263c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="90" r="220" fill="#0ea5e9" opacity="0.10"/>
  <circle cx="1060" cy="80" r="120" fill="#14b8a6" opacity="0.12"/>
  <rect x="78" y="74" width="1044" height="482" rx="26" fill="#111c2f" stroke="#27445b" stroke-width="2"/>
  <g transform="translate(128 122)">
    <circle cx="24" cy="24" r="20" fill="none" stroke="#22d3ee" stroke-width="6"/>
    <rect x="48" y="12" width="8" height="28" rx="4" fill="#22d3ee"/>
    <rect x="61" y="4" width="8" height="36" rx="4" fill="#14b8a6"/>
    <text x="92" y="34" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28" font-weight="700">Wealth Watcher</text>
  </g>
  <text x="128" y="246" fill="#f8fafc" font-family="Arial, sans-serif" font-size="58" font-weight="700">See your money's</text>
  <text x="128" y="316" fill="url(#accent)" font-family="Arial, sans-serif" font-size="58" font-weight="700">whole picture.</text>
  <text x="128" y="370" fill="#c6d5e4" font-family="Arial, sans-serif" font-size="24">Open source. Local first. Built for the choices ahead.</text>
  <g transform="translate(128 428)">
    <rect width="260" height="72" rx="14" fill="#0ea5e9"/>
    <text x="32" y="45" fill="#06111d" font-family="Arial, sans-serif" font-size="22" font-weight="700">Try the live demo</text>
  </g>
  <g transform="translate(720 175)">
    <rect width="310" height="230" rx="18" fill="#0f1b2d" stroke="#2c526b" stroke-width="2"/>
    <text x="28" y="46" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="14" font-weight="700">HOLISTIC NET WORTH</text>
    <text x="28" y="92" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">GBP 442,500</text>
    <rect x="28" y="124" width="254" height="12" rx="6" fill="#153d4b"/>
    <rect x="28" y="124" width="192" height="12" rx="6" fill="url(#accent)"/>
    <text x="28" y="174" fill="#a6bacb" font-family="Arial, sans-serif" font-size="15">Cash     Investments     Pensions     Property</text>
    <text x="28" y="205" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="15">Private workspace</text>
  </g>
</svg>
